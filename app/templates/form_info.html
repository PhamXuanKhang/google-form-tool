<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container my-4">
        <h2 class="text-center mb-4">Chỉnh Sửa Thông Tin Form</h2>
        
        <!-- Tổng số form -->
        <div class="mb-4">
            <label class="form-label">Tổng số form cần điền:</label>
            <input type="number" id="totalForms" class="form-control w-25" value="100" min="1">
        </div>

        <!-- Form chỉnh sửa -->
        <form action="{{ url_for('main.edit') }}" method="POST">
            {% for item in form_data %}
                <div class="question-card">
                    <h4>{{ item.question }}</h4>
                    {% if item.type in ['multiple_choice', 'dropdown'] %}
                        <!-- Đáp án trắc nghiệm/dropdown -->
                        <div class="mb-3">
                            <label>Đơn vị:</label>
                            <select class="form-select w-25 d-inline-block" name="unit_{{ loop.index0 }}" onchange="updateUnit(this, {{ loop.index0 }})">
                                <option value="percent">%</option>
                                <option value="count">Số lượng</option>
                            </select>
                        </div>
                        {% for option, percentage in zip(item.options, item.percentages) %}
                            <div class="mb-2">
                                <label>{{ option }}:</label>
                                <input type="range" name="perc_{{ loop.index0 }}_{{ loop.index1 }}" value="{{ percentage }}" min="0" max="100" class="form-range w-50 d-inline-block mx-2" oninput="updateValue(this)">
                                <input type="number" class="form-control w-25 d-inline-block" value="{{ percentage }}" readonly>
                            </div>
                        {% endfor %}
                        <button type="button" class="btn btn-secondary btn-sm" onclick="randomizePercentages({{ loop.index0 }})">Random</button>
                    {% elif item.type == 'text' %}
                        <!-- Câu hỏi dạng text -->
                        <div class="mb-3">
                            <label>Preview câu trả lời:</label>
                            <textarea name="text_{{ item.question }}" class="form-control">{{ item.get('answer', '') }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label>Prompt cho AI:</label>
                            <input type="text" class="form-control" placeholder="Nhập prompt để tạo câu trả lời...">
                            <button type="button" class="btn btn-primary btn-sm mt-2">AI Generate</button>
                        </div>
                    {% endif %}
                </div>
                <div class="arrow">↓</div>
            {% endfor %}
            <button type="submit" class="btn btn-success">Submit</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateUnit(select, questionIndex) {
            // Cập nhật đơn vị (% hoặc số lượng)
            console.log(`Câu hỏi ${questionIndex}: Đơn vị ${select.value}`);
        }
        function randomizePercentages(questionIndex) {
            // Random tỷ lệ
            let sliders = document.querySelectorAll(`input[name^="perc_${questionIndex}_"]`);
            let total = 100;
            let values = Array(sliders.length).fill(0);
            for (let i = 0; i < sliders.length - 1; i++) {
                values[i] = Math.floor(Math.random() * total);
                total -= values[i];
            }
            values[sliders.length - 1] = total;
            sliders.forEach((slider, idx) => {
                slider.value = values[idx];
                slider.nextElementSibling.value = values[idx];
            });
        }
        function updateValue(slider) {
            // Cập nhật giá trị từ slider
            slider.nextElementSibling.value = slider.value;
        }
    </script>
</body>
</html>
