<!DOCTYPE html>
<html lang=vi>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Google Form Automation Tool{% endblock %}</title>
    <link rel="stylesheet"  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    {% block css %}{% endblock %}
</head>
<body>
    <!-- ================= HEADER ================= -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                <i class="fas fa-robot mr-2"></i> Google Form Automation Tool
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'home' %}active{% endif %}" href="{{ url_for('main.index') }}"><i class="fas fa-home"></i> Home </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'form_filling' %}active{% endif %}" href="{{ url_for('main.form_filling') }}"><i class="fas fa-file-alt"></i> Form Filling </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'about' %}active{% endif %}" href="{{ url_for('main.about') }}"><i class="fas fa-info-circle"></i> About </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center ms-3">
                    <!-- Button to transfer between dark/light mode -->
                    <button class="btn btn-sm btn-light me-2" onclick="toggleDarkMode()">
                        <i id= "darkModeIcon" class="fas fa-moon"></i>
                    </button>

                </div>
            </div>

        </div>
    </nav>

    <!-- Space between navbar and banner -->
    <div style="height: 56px;"></div>

    <!-- Header Banner -->
    <header class="position-relative">
        <div class="w-100 h-64 bg-cover bg-center banner-img">
            <div class="position-absolute inset-0"></div>
        </div>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="container my-5">
        {% block content %}{% endblock %}
    </main>

    <!-- ================= FOOTER =================-->
    <footer class="py-4 border-top">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center text-center text-md-start">
            <div class="mb-2 mb-md-0">
                Made with <i class="fas fa-heart text-danger"></i> by KhangPham
            </div>
            <div class="mb-2 mb-md-0">
                ©2025 All rights reserved
            </div>
            <div>
                <a href="mailto:phamxuankhang2004@gmail.com" class="text-decoration-none me-3">
                    <i class="fas fa-envelope"></i> Email
                </a>
                <a href="https://www.linkedin.com/in/xuan-khang-pham-715208279/" target="_blank" class="text-decoration-none me-3">
                    <i class="fab fa-linkedin"></i> LinkedIn
                </a>
                <a href="https://github.com/PhamXuanKhang" target="_blank" class="text-decoration-none">
                    <i class="fab fa-github"></i> GitHub
                </a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
