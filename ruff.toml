# Ruff configuration — bug-focused gate.
#
# Selects only rules that catch real defects (syntax errors, runtime issues,
# unused code, undefined names) while ignoring cosmetic style noise
# (trailing whitespace, missing trailing newlines) that would otherwise flag
# hundreds of pre-existing lines unrelated to any change.
#
# This keeps CI green on the current codebase and ensures it fails only on
# new bugs introduced by a PR. Style normalization can be adopted separately
# later if desired.
line-length = 100
extend-exclude = [
    "build",
    "dist",
    "release",
    "node_modules",
    ".venv",
    "landing",
]

[lint]
# E9  syntax errors / runtime-parsing failures (always real bugs)
# F   pyflakes: unused imports/variables, undefined names, redefinitions,
#     `from x import *`, f-strings without placeholders
# We deliberately omit W (whitespace/newline warnings) — they are cosmetic
# and pervasive in the existing codebase.
select = ["E9", "F"]
