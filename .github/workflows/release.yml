name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Create Python virtual environment
        run: uv venv --python 3.11

      - name: Sync Python dependencies
        run: uv pip install --python .venv\Scripts\python.exe -r requirements.txt pyinstaller

      - name: Install Node dependencies
        run: npm ci

      - name: Build Windows installers and checksums
        shell: pwsh
        run: .\scripts\package-windows.ps1

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.msi
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.exe
            release/*.msi
            release/SHA256SUMS.txt
          body: |
            ## Google Form Automation Tool

            Windows installer artifacts are attached below.

            - Check `SHA256SUMS.txt` before install if you need integrity verification.
            - Windows SmartScreen may warn until the app is code signed or gains reputation.
            - Chrome/Chromium is required; the app can resolve ChromeDriver automatically when available.
