name: CI

# Quality gate: test, lint, and security scan on every pull request into a
# protected branch and on direct pushes to those branches. Failures here
# block merging and surface issues before they reach a tagged release.
on:
  pull_request:
    branches: [master, review]
  push:
    branches: [master, review]

# Cancel any in-flight run for the same ref when a new push lands, so we
# don't burn Action minutes on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        # Node is required for tests/test_js_prefill_validator.py, which shells
        # out to `node`. Without it the test is skipped (coverage silently
        # shrinks), so we install it explicitly.
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        # Default pytest.ini deselects the @pytest.mark.integration test that
        # needs a real browser; the remaining suite is fully mocked.
        run: python -m pytest --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        # Conservative rule set (E9/F/W) defined in ruff.toml — catches real
        # defects (syntax errors, unused imports, undefined names) without
        # reformatting existing style.
        run: ruff check app/ tests/ config.py wsgi.py

  security-scan:
    name: Secret & dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # gitleaks posts findings to code-scanning
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit, not just the
          # shallow clone default.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Scan for leaked secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          # Posts findings to the repo's Code Scanning alerts tab so they are
          # visible in the GitHub Security view. No SARIF upload on pass.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          # Fail the job on any known CVE in requirements.txt. Fixed deps are
          # resolved against PyPI, so this catches both pinned and unpinned
          # vulnerable versions.
          pip-audit -r requirements.txt --strict

      - name: Install Node dependencies for audit
        run: npm ci

      - name: Audit Node dependencies
        # --audit-level=high keeps the gate focused on high/critical CVEs so
        # moderate findings don't block PRs. Use `--omit=dev`? No — devDeps
        # (electron, electron-builder) ship in the release toolchain, so we
        # audit them too.
        run: npm audit --audit-level=high
